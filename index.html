<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111214">
<title>WordMap — карта знання англійської</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#111214; --surf:#2b2c2f; --surf2:#1c1d20; --surf3:#3a3b3f;
  --line:#3d3e42; --text:#fff; --muted:#a3a5a9; --dim:#75777c;
  --cyan:#25c9de; --cyan-d:#1ba9bd;
  --violet:#c026f5; --violet-l:#cf7bff;
  --gold:#f0b429; --good:#3fbf6f; --bad:#e0555a;
  --r:14px; --side:236px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Poppins,'Segoe UI',-apple-system,Roboto,Arial,sans-serif;
  font-size:15px;-webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer}

/* ================= КАРКАС САЙТУ ================= */
.app{display:flex;min-height:100vh}

.sidebar{
  width:var(--side);flex-shrink:0;background:var(--surf2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:20px 14px;
}
.logo{font-size:19px;font-weight:700;padding:0 10px 20px;display:flex;align-items:center;gap:9px}
.logo .mark{
  width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--cyan),var(--violet));
  display:flex;align-items:center;justify-content:center;font-size:15px;
}
.sidenav{display:flex;flex-direction:column;gap:3px;flex:1}
.sidenav button{
  display:flex;align-items:center;gap:11px;background:none;border:none;color:var(--muted);
  padding:11px 12px;border-radius:10px;font-size:14.5px;font-weight:500;text-align:left;width:100%;
}
.sidenav button i{font-style:normal;font-size:18px;width:22px;text-align:center}
.sidenav button:hover{background:var(--surf);color:var(--text)}
.sidenav button.on{background:var(--cyan);color:#04282d;font-weight:600}
.sidenav .n{
  margin-left:auto;background:var(--violet);color:#fff;font-size:11px;font-weight:700;
  border-radius:999px;padding:2px 7px;min-width:22px;text-align:center;
}
.sidenav button.on .n{background:rgba(0,0,0,.25);color:#04282d}
.side-foot{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.side-stat{display:flex;align-items:center;gap:9px;padding:0 10px;font-size:13px;color:var(--muted)}
.side-stat b{color:var(--text);font-size:15px}

.content{flex:1;min-width:0;display:flex;flex-direction:column}

.topbar{
  position:sticky;top:0;z-index:40;background:rgba(17,18,20,.94);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:14px 28px;
}
.topbar .tb-title{font-size:20px;font-weight:600;flex:1}
.topbar .tb-btn{
  background:var(--surf);border:none;color:var(--text);font-size:19px;width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;border-radius:10px;flex-shrink:0;
}
.topbar .tb-btn:hover{background:var(--surf3)}
.topbar .tb-btn.ghost{display:none}
.gems{
  display:flex;align-items:center;gap:7px;background:var(--surf);
  border-radius:999px;padding:6px 14px 6px 7px;font-weight:600;font-size:14px;flex-shrink:0;
}
.gems .g{
  width:22px;height:22px;border-radius:50%;background:var(--gold);
  display:flex;align-items:center;justify-content:center;font-size:12px;color:#3a2a00;
}

main{flex:1;padding:24px 28px 60px}
.wrap{max-width:1180px;margin:0 auto}
.wrap.page-enter{animation:pageIn .2s ease}
@keyframes pageIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.wrap.narrow{max-width:720px}

/* нижні вкладки — лише на вузьких екранах */
.tabbar{display:none}

/* ================= БАЗОВІ ЕЛЕМЕНТИ ================= */
.card{background:var(--surf);border-radius:var(--r);padding:18px;margin-bottom:16px}
.muted{color:var(--muted);font-size:13.5px}
.dim{color:var(--dim);font-size:12px}
.center{text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between;align-items:center;flex-wrap:nowrap}
.row.nowrap{flex-wrap:nowrap}
.hidden{display:none !important}
h2{font-size:17px;margin:0 0 12px;font-weight:600}
h3{font-size:12.5px;margin:26px 0 12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}
h3:first-child{margin-top:0}

.btn{
  border:none;border-radius:10px;padding:13px 20px;font-size:15px;font-weight:600;
  color:#fff;background:var(--surf3);transition:.15s;
}
.btn:hover{filter:brightness(1.14)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.cyan{background:var(--cyan);color:#04282d}
.btn.violet{background:var(--violet)}
.btn.wide{width:100%}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.ghost:hover{background:var(--surf);border-color:var(--cyan)}
.btn.sm{padding:9px 15px;font-size:13.5px}
.btn.link{background:none;color:var(--muted);font-weight:500;padding:10px}
.btn.link:hover{color:var(--text)}

input,textarea,select{
  width:100%;background:var(--surf2);border:1px solid var(--line);color:var(--text);
  border-radius:10px;padding:12px 14px;font-size:14.5px;font-family:inherit;
}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--cyan)}
textarea{min-height:130px;resize:vertical;line-height:1.55}
label.f{display:block;margin-bottom:14px}
label.f span{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
label.chk{display:flex;align-items:center;gap:10px;font-size:14px;margin-bottom:12px;cursor:pointer}
label.chk input{width:auto;accent-color:var(--cyan)}

/* сітка колонок для широких екранів */
.cols{display:grid;gap:16px}
.cols.c2{grid-template-columns:repeat(2,1fr)}
.cols.c3{grid-template-columns:repeat(3,1fr)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:22px;align-items:start}

/* ================= ОБКЛАДИНКА ================= */
/* Невисока смуга-заголовок замість великого фото — щоб не гортати екран
   для кожного окремого слова в тріажі/вивченні. */
.cover{
  position:relative;border-radius:var(--r);overflow:hidden;
  height:76px;display:flex;align-items:center;justify-content:center;
}
.cover .letter{font-size:30px;font-weight:700;color:rgba(255,255,255,.22);letter-spacing:-1px;user-select:none}
.cover .pos-tag{
  position:absolute;left:10px;bottom:8px;background:rgba(0,0,0,.45);
  border-radius:999px;padding:3px 10px;font-size:11px;backdrop-filter:blur(4px);
}
.cover .dots{
  position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:50%;
  background:rgba(0,0,0,.45);border:none;color:#fff;font-size:13px;
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);
}

/* ================= КАРТКА СЛОВА ================= */
.wordline{display:flex;align-items:flex-start;gap:12px}
.wordline h1{font-size:31px;margin:0;font-weight:600;line-height:1.15;flex:1}
.phon{color:var(--muted);font-size:15px}
.trans{color:var(--violet-l);font-size:20px;font-weight:600;margin:12px 0 0}
.defn{color:var(--muted);font-size:15.5px;line-height:1.55;margin:12px 0 0}
.speaker{background:none;border:none;color:var(--text);font-size:21px;padding:2px 4px}
.example{
  background:var(--surf2);border-radius:10px;padding:14px 16px;margin-top:16px;
  font-style:italic;line-height:1.6;font-size:15px;
}
.example b{color:var(--violet-l);font-style:italic;font-weight:600}
.actions2{display:flex;gap:12px;margin-top:18px}
.actions2 .btn{flex:1}

.segments{display:flex;gap:3px;margin-top:6px}
.segments i{width:14px;height:6px;border-radius:2px;background:var(--surf3)}
.segments i.on{background:var(--cyan)}
.segments i.max{background:var(--good)}

/* ================= КАРТА ЗНАНЬ ================= */
.bandgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:9px}
.band{
  position:relative;background:var(--surf);border-radius:9px;overflow:hidden;border:none;
  color:var(--text);padding:14px 4px;font-size:13.5px;font-weight:600;text-align:center;
}
.band .fill{position:absolute;inset:0 auto 0 0;background:var(--cyan);opacity:.85}
.band span{position:relative;z-index:1;mix-blend-mode:difference}
.band.cur{outline:2px solid #ff2d6f;outline-offset:-2px}

.tilegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:9px}
.tile{
  background:var(--surf);border:none;border-radius:9px;color:var(--text);
  padding:16px 8px;font-size:14.5px;font-weight:500;min-height:58px;
  display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.25;
}
.tile:hover{background:var(--surf3)}
.tile.known{background:rgba(37,201,222,.16);color:var(--cyan)}
.tile.learn{background:rgba(192,38,245,.16);color:var(--violet-l)}
.tile.done{background:rgba(63,191,111,.16);color:var(--good)}

.rangebar{
  display:flex;align-items:center;justify-content:center;gap:8px;background:var(--surf);
  border-radius:999px;padding:11px 20px;margin:18px auto 0;width:fit-content;
  font-weight:600;font-size:14px;border:none;color:var(--text);
}
.minimap{display:grid;grid-template-columns:repeat(auto-fill,minmax(16px,1fr));gap:4px;margin-top:14px}
.minimap i{aspect-ratio:1;border-radius:2px;background:var(--surf)}
.minimap i.p{background:var(--cyan);opacity:.35}
.minimap i.f{background:var(--cyan)}
.minimap i.cur{outline:1.5px solid #ff2d6f}

/* ================= НАБОРИ ================= */
.listgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.listrow{
  display:flex;align-items:center;gap:13px;background:var(--surf);border-radius:11px;
  padding:11px;border:none;color:var(--text);text-align:left;position:relative;overflow:hidden;width:100%;
}
.listrow:hover{background:var(--surf3)}
.listrow .thumb{
  width:68px;height:54px;border-radius:8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:21px;
}
.listrow .meta{flex:1;min-width:0}
.listrow .nm{font-size:15px;font-weight:600;margin-bottom:7px}
.listrow .bar{height:4px;background:var(--surf3);border-radius:99px;overflow:hidden}
.listrow .bar>div{height:100%;background:var(--cyan)}
.listrow .pc{font-size:12.5px;color:var(--muted);margin-top:5px}
.listrow .chev{color:var(--dim);font-size:20px}

/* ================= ЧИТАННЯ ================= */
.textitem{
  display:block;width:100%;text-align:left;padding:13px 15px;background:var(--surf2);
  border:none;border-radius:10px;margin-bottom:9px;color:var(--text);
}
.textitem:hover{background:var(--surf3)}
.reading-body{line-height:2;font-size:16.5px}
.reading-body .tok{cursor:pointer;border-radius:3px;padding:1px 2px}
.reading-body .tok:hover{background:var(--surf3)}
.reading-body .tok.known{background:rgba(37,201,222,.2);box-shadow:inset 0 -2px 0 rgba(37,201,222,.6)}
.reading-body .tok.mastered{background:rgba(63,191,111,.18);box-shadow:inset 0 -2px 0 rgba(63,191,111,.55)}
.panel-mini{background:var(--surf2);border-radius:9px;padding:11px 13px;margin-top:9px}
.panel-mini .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);margin-bottom:5px}

/* ================= COMPARE ================= */
.cmp-title{text-align:center;font-size:21px;font-weight:600;color:var(--violet-l);margin:4px 0 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.mid{justify-content:center}
.chip{background:var(--surf);border:none;border-radius:9px;color:var(--text);padding:10px 16px;font-size:14px;font-weight:500}
.chip:hover{background:var(--surf3)}
.chip.on{background:var(--cyan);color:#04282d;font-weight:600}
.cmp-text{line-height:1.65;font-size:15.5px;max-width:760px;margin:0 auto}
.cmp-text p{margin:0 0 15px}
.cmp-text .a{color:var(--cyan)}
.cmp-text .b{color:var(--violet-l)}

/* ================= ТЕСТИ ================= */
.optbtn{
  display:block;width:100%;text-align:left;background:var(--surf2);border:1.5px solid var(--line);
  color:var(--text);padding:15px 18px;border-radius:11px;margin-bottom:10px;font-size:15.5px;transition:.12s;
}
.optbtn:hover:not(:disabled){border-color:var(--cyan);background:var(--surf3)}
.optbtn:disabled{cursor:default}
.optbtn.correct{background:rgba(63,191,111,.18);border-color:var(--good)}
.optbtn.wrong{background:rgba(224,85,90,.18);border-color:var(--bad)}
.qkind{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--cyan);margin-bottom:10px;font-weight:600}
.qtitle{font-size:19px;margin-bottom:20px;line-height:1.55;font-weight:500}
.qtitle b{color:var(--violet-l)}
.gap{display:inline-block;min-width:100px;border-bottom:2px dashed var(--cyan);margin:0 4px}
.tresult{margin-top:14px;font-size:15px;line-height:1.55}
.tresult.ok{color:var(--good)}
.tresult.no{color:var(--bad)}
.tresult .right{color:var(--good);font-weight:600}
.progressbar{height:6px;background:var(--surf);border-radius:99px;overflow:hidden;margin-bottom:20px}
.progressbar>div{height:100%;background:var(--cyan);transition:width .3s}
.mistakes{display:flex;flex-direction:column;gap:8px}
.mistake{
  display:flex;justify-content:space-between;gap:12px;background:var(--surf2);
  border-radius:9px;padding:11px 14px;font-size:14px;
}

/* картка вибору визначення (слово → визначення) */
.defcard{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  background:var(--surf2);border:1.5px solid var(--line);border-radius:11px;
  padding:12px;margin-bottom:10px;color:var(--text);transition:.12s;
}
.defcard:hover:not(:disabled){border-color:var(--cyan);background:var(--surf3)}
.defcard:disabled{cursor:default}
.defcard.correct{background:rgba(63,191,111,.18);border-color:var(--good)}
.defcard.wrong{background:rgba(224,85,90,.18);border-color:var(--bad)}
.dc-thumb{width:52px;height:42px;border-radius:8px;flex-shrink:0}
.dc-text{font-size:14.5px;line-height:1.45}

/* кнопка відтворення для тестів на слух */
.playbtn{
  width:78px;height:78px;border-radius:50%;border:none;background:var(--cyan);
  color:#04282d;font-size:26px;display:inline-flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 8px rgba(37,201,222,.12);
}
.playbtn:hover{filter:brightness(1.1)}

/* плавна поява картки запитання при переході між тестами */
.qcard{animation:qcardIn .22s ease}
@keyframes qcardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ================= ПОВТОРЕННЯ / ТРЕКІНГ ================= */
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:11px}
.stat{background:var(--surf);border-radius:11px;padding:15px;text-align:center}
.stat b{display:block;font-size:26px;line-height:1.2}
.stat span{font-size:11.5px;color:var(--muted)}

.forecast{display:flex;align-items:flex-end;gap:5px;height:130px;margin-top:6px}
.forecast .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
.forecast .bar{
  width:100%;background:var(--cyan);border-radius:4px 4px 0 0;min-height:3px;transition:.2s;
}
.forecast .col.today .bar{background:var(--violet)}
.forecast .col.over .bar{background:var(--bad)}
.forecast .lb{font-size:10px;color:var(--dim);white-space:nowrap}
.forecast .vl{font-size:11px;color:var(--muted);font-weight:600}

.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:3px;margin-top:8px}
.heat i{width:100%;aspect-ratio:1;border-radius:2.5px;background:var(--surf);min-width:9px}
.heat i.l1{background:rgba(37,201,222,.3)}
.heat i.l2{background:rgba(37,201,222,.55)}
.heat i.l3{background:rgba(37,201,222,.78)}
.heat i.l4{background:var(--cyan)}
.heat-legend{display:flex;align-items:center;gap:6px;justify-content:flex-end;margin-top:8px;font-size:11px;color:var(--dim)}
.heat-legend i{width:11px;height:11px;border-radius:2.5px;display:inline-block;background:var(--surf)}

.duelist{display:flex;flex-wrap:wrap;gap:8px}
.duechip{
  background:var(--surf2);border:1px solid var(--line);border-radius:8px;
  padding:8px 12px;font-size:13.5px;color:var(--text);
}
.duechip.over{border-color:var(--bad);color:#ffb4b6}
.duechip small{color:var(--dim);margin-left:6px}

/* ================= ЛИСТ / ТОСТ ================= */
.sheetwrap{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.68);padding:20px}
.sheet{
  background:var(--surf);width:100%;max-width:440px;border-radius:16px;padding:26px 24px;
  max-height:88vh;overflow:auto;animation:pop .18s ease;
}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.sheet h2{text-align:center;color:var(--cyan);font-size:23px;margin-bottom:4px}
.sheet .sub{text-align:center;color:var(--muted);margin-bottom:20px;font-size:14px}
.radio{display:flex;align-items:center;gap:12px;padding:11px 4px;font-size:15.5px;cursor:pointer}
.radio input{width:auto;accent-color:var(--cyan);transform:scale(1.25)}
.radio .rec{color:var(--muted);font-size:13px}

.actionbar{
  display:flex;align-items:center;gap:14px;background:var(--surf2);
  border:1px solid var(--line);border-radius:12px;padding:13px 16px;
}
.actionbar .left{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.actionbar .tick{
  width:32px;height:32px;border-radius:50%;background:var(--cyan);color:#04282d;
  display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;
}
.actionbar .lbl{font-size:13px;color:var(--muted)}

.empty{text-align:center;color:var(--muted);padding:60px 20px;line-height:1.7}
.empty .big{font-size:52px;margin-bottom:14px}

.toast{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(60px);
  background:var(--surf3);color:#fff;padding:13px 22px;border-radius:999px;
  font-size:14.5px;z-index:200;opacity:0;transition:.25s;pointer-events:none;max-width:90%;
  box-shadow:0 8px 30px rgba(0,0,0,.5);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--bad)}
.toast.ok{background:var(--good);color:#04250f}

.spinner{
  display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.25);
  border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;
}
@keyframes sp{to{transform:rotate(360deg)}}
.note-input{background:none;border:none;color:var(--muted);padding:12px 0;font-size:14px}
.note-input:focus{color:var(--text)}

/* ================= ТАКТИЛЬНИЙ ВІДГУК ================= */
/* миттєва реакція на дотик/клік — усе, по чому тапають, трохи «просідає» */
.btn,.optbtn,.defcard,.tile,.band,.chip,.listrow,.duechip,
.tb-btn,.speaker,.playbtn,.sidenav button,.tabbar button,.radio{
  transition:transform .08s ease, filter .08s ease, background .12s ease, border-color .12s ease;
  -webkit-tap-highlight-color:transparent;
}
.btn:active:not(:disabled),.optbtn:active:not(:disabled),.defcard:active:not(:disabled),
.tile:active,.band:active,.chip:active,.listrow:active,.duechip:active,
.tb-btn:active,.speaker:active,.playbtn:active,.sidenav button:active,.tabbar button:active{
  transform:scale(.96);
}

/* ================= АДАПТИВ ================= */
@media(max-width:1000px){
  .split{grid-template-columns:1fr;gap:16px}
  .cols.c3{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:760px){
  .sidebar{display:none}

/* cloud.js — синхронізація через Firebase Firestore БЕЗ входу в акаунт.
   Один спільний документ на весь сайт: усі, хто відкриє сторінку з тим самим
   конфігом проєкту, бачать ті самі дані та отримують зміни одне одного
   в реальному часі (onSnapshot). Немає користувачів, немає приватності —
   це навмисно публічна спільна дошка, а не персональний акаунт. */

/* Вбудований конфіг проєкту — сайт підключається до спільного сховища сам,
   без ручного вставляння конфігурації. Це не секрет: ключ Firebase для
   веброзробки призначений бути публічним, захист лежить на правилах
   Firestore (Rules), а не на приховуванні цього об'єкта. */
const DEFAULT_FIREBASE_CONFIG = JSON.stringify({
  apiKey: "AIzaSyB-j0NTweiy0q2KCUKVTFF106OlAO9napQ",
  authDomain: "english-ba621.firebaseapp.com",
  databaseURL: "https://english-ba621-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "english-ba621",
  storageBucket: "english-ba621.firebasestorage.app",
  messagingSenderId: "1055258408142",
  appId: "1:1055258408142:web:02e851b942533e08090c9f"
});

const Cloud = (function(){
  const SDK = 'https://www.gstatic.com/firebasejs/10.13.0/';
  const DOC_PATH = ['shared', 'wordmap'];   // єдиний документ для всього сайту

  let appMod = null, fsMod = null;
  let app = null, db = null;
  let ready = false;
  let unsub = null;
  let lastSeenJson = null;   // щоб не зациклюватись на власних змінах, що повернулись
  let saveTimer = null;

  async function ensureSdk(){
    if(appMod) return;
    [appMod, fsMod] = await Promise.all([
      import(SDK + 'firebase-app.js'),
      import(SDK + 'firebase-firestore.js')
    ]);
  }

  /* Приймає або готовий об'єкт, або текст, скопійований прямо з консолі
     Firebase (з неекранованими ключами, можливо разом з "const ... = ") */
  function parseConfig(raw){
    if(typeof raw === 'object' && raw) return raw;
    const text = String(raw).trim();
    try{ return JSON.parse(text); }catch(e){}
    const match = text.match(/\{[\s\S]*\}/);
    if(!match) throw new Error('Не вдалося розпізнати конфігурацію');
    /* eslint-disable no-new-func */
    return new Function('return (' + match[0] + ')')();
  }

  async function configure(rawConfig){
    await ensureSdk();
    const cfg = parseConfig(rawConfig);
    app = appMod.initializeApp(cfg);
    db = fsMod.getFirestore(app);
    ready = true;
    return cfg;
  }

  function isConfigured(){ return ready; }

  /* Підписка на живі зміни спільного документа. cb(data) викликається щоразу,
     коли хтось (включно з нами самими) оновлює документ — крім випадку,
     коли це відлуння нашого ж щойного push(). */
  function watch(cb){
    if(unsub){ unsub(); unsub = null; }
    const ref = fsMod.doc(db, ...DOC_PATH);
    unsub = fsMod.onSnapshot(ref, snap => {
      if(!snap.exists()) return;
      const v = snap.data();
      if(!v || !v.data || v.data === lastSeenJson) return;
      lastSeenJson = v.data;
      try{ cb(JSON.parse(v.data)); }catch(e){}
    }, err => console.warn('Firestore: помилка підписки', err));
  }

  async function push(data){
    const json = JSON.stringify(data);
    if(json === lastSeenJson) return;   // ідентично тому, що вже на сервері
    lastSeenJson = json;
    await fsMod.setDoc(fsMod.doc(db, ...DOC_PATH), {data: json, updatedAt: Date.now()});
  }

  /* Фонове збереження з невеликою затримкою — щоб не бити в мережу на
     кожну дрібну зміну (наприклад, кожне слово в тріажі) */
  function autosave(data){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { push(data).catch(() => {}); }, 1200);
  }

  return { configure, isConfigured, watch, push, autosave };
})();

/* Перетворює текстовий банк на масив об'єктів із рангами за частотністю */
function parseStarterBank(){
  return STARTER_BANK.split('\n').map((line, i) => {
    const [word, translation, pos] = line.split('|');
    return { rank: i + 1, word: word.trim(), translation: translation.trim(), pos: (pos || '').trim() };
  });
}

/* core.js — утиліти, сховище та логіка повторень у стилі WordUp */

/* =========================================================
   Utils
   ========================================================= */
const Utils = {
  uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); },

  esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  },

  /* Дати — локальні, без переходу в UTC (інакше пояс зсуває день) */
  fmtLocal(d){
    const p = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
  },
  today(){ return Utils.fmtLocal(new Date()); },
  addDays(iso, n){
    const [y,m,d] = iso.split('-').map(Number);
    return Utils.fmtLocal(new Date(y, m-1, d+n));
  },
  daysBetween(a, b){
    return Math.round((Date.parse(b+'T00:00:00Z') - Date.parse(a+'T00:00:00Z')) / 86400000);
  },
  fmtWhen(iso){
    if(!iso) return 'ніколи';
    const d = Utils.daysBetween(Utils.today(), iso);
    if(d < 0)  return `прострочено ${-d} дн.`;
    if(d === 0) return 'сьогодні';
    if(d === 1) return 'завтра';
    if(d < 7)  return `через ${d} дн.`;
    if(d < 31) return `через ${Math.round(d/7)} тиж.`;
    if(d < 365) return `через ${Math.round(d/30)} міс.`;
    return `через ${Math.round(d/365)} р.`;
  },

  shuffle(arr){
    const a = [...arr];
    for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
    return a;
  },
  pick(arr, n){ return Utils.shuffle(arr).slice(0, n); },
  norm(s){ return String(s||'').trim().toLowerCase(); },

  /* Детермінований градієнт-обкладинка для слова (замість фото) */
  hue(str){
    let h = 0;
    for(let i=0;i<str.length;i++) h = (h*31 + str.charCodeAt(i)) % 360;
    return h;
  },
  cover(word){
    const h1 = Utils.hue(word);
    const h2 = (h1 + 55) % 360;
    return `linear-gradient(135deg, hsl(${h1} 62% 34%), hsl(${h2} 58% 20%))`;
  },

  speak(text, lang='en-US'){
    if(!Store.db.settings.tts) return;
    Utils.speakForce(text, lang);
  },

  /* Озвучення, що ігнорує тумблер «Озвучувати слова» — для тестів на слух,
     де звук є самою суттю запитання, а не додатковою зручністю. */
  speakForce(text, lang='en-US'){
    if(!window.speechSynthesis) return;
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang; u.rate = .9;
      speechSynthesis.speak(u);
    }catch(e){}
  },

  toast(msg, kind=''){
    const el = document.getElementById('toast');
    if(!el) return;
    el.textContent = msg;
    el.className = 'toast show ' + kind;
    clearTimeout(Utils._t);
    Utils._t = setTimeout(() => { el.className = 'toast ' + kind; }, 2400);
  }
};

  /* Рекомендований інтервал = наступна сходинка драбини.
     Бонус за «чистий» день: якщо на цьому слові сьогодні ще не було
     помилки, стрибаємо на сходинку далі вперед (напр. не +1 день, а +2). */
  recommendedDays(w){
    const stage = Math.min(w.timesRemembered || 0, SRS.LADDER.length - 1);
    const perfectToday = w.lastMistakeDate !== Utils.today();
    const bonusStage = perfectToday ? Math.min(stage + 1, SRS.LADDER.length - 1) : stage;
    return SRS.LADDER[bonusStage];
  },

  /* Який із варіантів підсвітити як «рекомендовано» */
  recommendedOption(w){
    const days = SRS.recommendedDays(w);
    let best = SRS.OPTIONS[0];
    for(const o of SRS.OPTIONS){
      if(o.days !== null && o.days <= days) best = o;
    }
    return best.id;
  },

  isDue(w){
    return (w.status === 'learning') && !!w.nextReview && w.nextReview <= Utils.today();
  },

  /* Слово згадали — планування наступного показу */
  remember(w, days){
    w.timesRemembered = (w.timesRemembered || 0) + 1;
    w.lastReview = Utils.today();
    if(days === null){
      w.status = 'mastered';
      w.nextReview = null;
    } else {
      w.status = 'learning';
      w.nextReview = Utils.addDays(Utils.today(), days);
    }
  },

  /* Слово забули — назад на завтра, лічильник згадувань скидається.
     Позначаємо день помилки, щоб сьогодні вже не діяв бонус за «чистий» день. */
  forget(w){
    w.timesRemembered = 0;
    w.lastReview = Utils.today();
    w.lastMistakeDate = Utils.today();
    w.status = 'learning';
    w.nextReview = Utils.addDays(Utils.today(), 1);
  }
};

/* =========================================================
   Store
   ========================================================= */
const Store = (function(){
  const KEY = 'wordmap_v1';

  function defaults(){
    return {
      version: 1,
      words: [],
      lists: [],                 // {id, name, wordIds[], createdAt}
      texts: [],                 // {id, title, body, source, createdAt}
      gems: 0,
      history: {},               // 'YYYY-MM-DD' -> {triaged, learned, reviewed}
      settings: {
        tts:true, apiKey:'', model:'claude-opus-5',
        autoEnrich:true, bandSize:100,
        testsAffectSrs:true,         // чи просувають тести розклад повторень
        firebaseConfig:'',           // JSON-конфіг проєкту Firebase (порожньо = вбудований за замовчуванням)
        cloudDisabled:false          // true — користувач сам натиснув «Відключити»
      }
    };
  }

  let db = defaults();

  function makeWord(o){
    return {
      id: Utils.uid(),
      rank: o.rank || 999999,
      word: o.word,
      translation: o.translation || '',
      pos: o.pos || '',
      phonetic: o.phonetic || '',
      definition: o.definition || '',
      example: o.example || '',
      synonyms: o.synonyms || [],
      antonyms: o.antonyms || [],
      note: '',
      favorite: false,
      lists: o.lists || [],
      /* прогрес */
      status: 'new',              // new | learning | mastered
      timesRemembered: 0,
      nextReview: null,
      lastReview: null,
      lastMistakeDate: null,      // для бонусу за день без жодної помилки
      enriched: false,
      custom: !!o.custom,
      createdAt: Date.now()
    };
  }

  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){}
    /* якщо підключено спільний сервер — тихо синхронізуємо у фоні */
    if(typeof Cloud !== 'undefined' && Cloud.isConfigured()) Cloud.autosave(db);
  }

  function normalize(w){
    const base = makeWord({word:w.word});
    for(const k in base) if(w[k] === undefined) w[k] = base[k];
    return w;
  }

  function load(){
    try{
      const raw = localStorage.getItem(KEY);
      if(raw){
        const p = JSON.parse(raw);
        db = Object.assign(defaults(), p);
        db.settings = Object.assign(defaults().settings, p.settings || {});
        db.words.forEach(normalize);
        return;
      }
    }catch(e){ db = defaults(); }
    seed();
  }

  /* Перший запуск — заливаємо стартовий банк */
  function seed(){
    db = defaults();
    parseStarterBank().forEach(o => db.words.push(makeWord(o)));
    db.lists.push({
      id: 'essential',
      name: 'Базові 300',
      wordIds: db.words.slice(0, 300).map(w => w.id),
      createdAt: Date.now(),
      builtin: true
    });
    save();
  }

  function logDay(field, n = 1){
    const d = Utils.today();
    db.history[d] = db.history[d] || {triaged:0, learned:0, reviewed:0};
    db.history[d][field] = (db.history[d][field] || 0) + n;
  }

  load();

  const API = {
    get db(){ return db; },
    save, logDay, makeWord,

    addGems(n){ db.gems += n; },

    /* ---- слова ---- */
    get(id){ return db.words.find(w => w.id === id); },
    byWord(word){ return db.words.find(w => Utils.norm(w.word) === Utils.norm(word)); },
    has(word){ return !!API.byWord(word); },

    add(o){
      const w = makeWord({...o, custom: true});
      /* власні слова стають у кінець карти знань */
      if(!o.rank) w.rank = Math.max(0, ...db.words.map(x => x.rank)) + 1;
      db.words.push(w);
      save();
      return w;
    },

    remove(id){
      db.words = db.words.filter(w => w.id !== id);
      db.lists.forEach(l => l.wordIds = l.wordIds.filter(x => x !== id));
      save();
    },

    /* усі слова, впорядковані за рангом */
    ranked(){ return [...db.words].sort((a,b) => a.rank - b.rank); },

    /* ---- смуги карти знань ---- */
    bandSize(){ return db.settings.bandSize || 100; },

    bands(){
      const size = API.bandSize();
      const all = API.ranked();
      const out = [];
      for(let i = 0; i < all.length; i += size){
        const chunk = all.slice(i, i + size);
        const done = chunk.filter(w => w.status !== 'new').length;
        out.push({
          index: out.length,
          from: i + 1,
          to: i + chunk.length,
          words: chunk,
          done,
          pct: Math.round(done / chunk.length * 100)
        });
      }
      return out;
    },

    /* перша смуга, де ще лишились неопрацьовані слова */
    currentBandIndex(){
      const bands = API.bands();
      const idx = bands.findIndex(b => b.done < b.words.length);
      return idx === -1 ? Math.max(0, bands.length - 1) : idx;
    },

    /* ---- черги ---- */
    toLearn(){ return db.words.filter(w => w.status === 'learning' && !w.nextReview).sort((a,b) => a.rank - b.rank); },
    due(){ return db.words.filter(SRS.isDue).sort((a,b) => (a.nextReview||'').localeCompare(b.nextReview||'')); },

    /* ---- списки ---- */
    listWords(listId){
      if(listId === 'all') return API.ranked();
      if(listId === 'favorite') return db.words.filter(w => w.favorite);
      if(listId === 'custom')  return db.words.filter(w => w.custom);
      const l = db.lists.find(x => x.id === listId);
      if(!l) return [];
      const set = new Set(l.wordIds);
      return API.ranked().filter(w => set.has(w.id));
    },

    listProgress(listId){
      const ws = API.listWords(listId);
      if(!ws.length) return 0;
      const done = ws.filter(w => w.status !== 'new').length;
      return Math.round(done / ws.length * 100);
    },

    addList(name, wordIds){
      const l = {id: Utils.uid(), name, wordIds, createdAt: Date.now()};
      db.lists.push(l); save(); return l;
    },

    removeList(id){
      db.lists = db.lists.filter(l => l.id !== id);
      save();
    },

    /* ---- тексти для читання ---- */
    addText(o){
      const t = {id: Utils.uid(), title: o.title, body: o.body,
                 source: o.source || 'manual', createdAt: Date.now()};
      db.texts.push(t); save(); return t;
    },
    getText(id){ return db.texts.find(t => t.id === id); },
    removeText(id){ db.texts = db.texts.filter(t => t.id !== id); save(); },

    /* ---- статистика ---- */
    stats(){
      const w = db.words;
      const by = {new:0, learning:0, mastered:0};
      w.forEach(x => by[x.status] = (by[x.status]||0) + 1);
      const covered = w.length - by.new;
      /* «learning» об'єднує дві фази: у черзі на перше вивчення (ще нема
         дати) і вже на активному розкладі повторень (дата є) */
      const toLearn = w.filter(x => x.status === 'learning' && !x.nextReview).length;
      const studying = w.filter(x => x.status === 'learning' && !!x.nextReview).length;
      return {
        total: w.length,
        ...by,
        covered,
        coverage: w.length ? Math.round(covered / w.length * 100) : 0,
        due: API.due().length,
        toLearn, studying,
        gems: db.gems
      };
    },

    /* ---- імпорт / експорт ---- */
    exportJSON(){ return JSON.stringify(db, null, 2); },

    importJSON(raw){ API.importObject(JSON.parse(raw)); },

    /* Те саме, що importJSON, але приймає вже розібраний об'єкт —
       використовується для відновлення даних із Firestore */
    importObject(p){
      if(!p || !Array.isArray(p.words)) throw new Error('Невірний формат даних');
      db = Object.assign(defaults(), p);
      db.settings = Object.assign(defaults().settings, p.settings || {});
      db.words.forEach(normalize);
      save();
    },

    /* Таблиця: word,translation,pos,definition,example — з роздільником , ; або таб.
       Повертає {added, skipped, list} */
    importTable(raw, listName){
      const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      if(!lines.length) return {added:0, skipped:0, list:null};

      /* якщо перший рядок схожий на заголовок — пропускаємо */
      const head = Utils.norm(lines[0]);
      const hasHeader = /(word|слово)/.test(head) && /(translation|переклад|meaning)/.test(head);
      const rows = hasHeader ? lines.slice(1) : lines;

      const ids = [];
      let added = 0, skipped = 0;
      let nextRank = Math.max(0, ...db.words.map(x => x.rank)) + 1;

      rows.forEach(line => {
        const cells = splitRow(line);
        const [word, translation, pos, definition, example] = cells;
        if(!word) return;
        const existing = API.byWord(word);
        if(existing){
          /* не дублюємо, лише додаємо у список і доповнюємо порожні поля */
          if(translation && !existing.translation) existing.translation = translation;
          if(definition && !existing.definition) existing.definition = definition;
          if(example && !existing.example) existing.example = example;
          ids.push(existing.id);
          skipped++;
          return;
        }
        const w = makeWord({
          word, translation: translation || '', pos: pos || '',
          definition: definition || '', example: example || '',
          rank: nextRank++, custom: true
        });
        db.words.push(w);
        ids.push(w.id);
        added++;
      });

      let list = null;
      if(listName && ids.length) list = API.addList(listName, ids);
      save();
      return {added, skipped, list};
    },

    reset(){ localStorage.removeItem(KEY); seed(); }
  };

  /* Розбирає рядок таблиці з урахуванням лапок */
  function splitRow(line){
    if(line.includes('\t')) return line.split('\t').map(clean);
    const out = [];
    let cur = '', q = false;
    for(const ch of line){
      if(ch === '"'){ q = !q; continue; }
      if((ch === ',' || ch === ';') && !q){ out.push(cur); cur = ''; continue; }
      cur += ch;
    }
    out.push(cur);
    return out.map(clean);
  }
  function clean(s){ return String(s).trim().replace(/^"|"$/g, ''); }

  return API;
})();

/* Реєстр екранів */
const Views = { map:{}, register(id, def){ def.id = id; Views.map[id] = def; } };

/* api.js — зовнішні джерела: відкриті словники (без ключа) + опційно Claude */

const Api = (function(){

  /* fetch без тайм-ауту може зависнути назавжди, якщо зовнішній хост підвисає
     (dictionaryapi.dev так робить час від часу) — тоді паралельні воркери
     масового збагачення застрягають без жодного шансу завершитись. */
  async function fetchTimeout(url, ms = 7000){
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), ms);
    try{ return await fetch(url, {signal: ctrl.signal}); }
    finally{ clearTimeout(t); }
  }

  /* ---------- безкоштовні словники ---------- */
  async function fetchDictionary(word){
    const res = await fetchTimeout('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(word.trim()));
    if(!res.ok) return null;
    const data = await res.json();
    if(!Array.isArray(data) || !data.length) return null;

    const out = {phonetic:'', pos:'', definition:'', example:'', synonyms:[], antonyms:[], examples:[]};
    for(const entry of data){
      if(!out.phonetic){
        out.phonetic = entry.phonetic || (entry.phonetics||[]).map(p=>p.text).find(Boolean) || '';
      }
      for(const m of entry.meanings || []){
        if(!out.pos) out.pos = m.partOfSpeech || '';
        out.synonyms.push(...(m.synonyms||[]));
        out.antonyms.push(...(m.antonyms||[]));
        for(const d of m.definitions || []){
          if(!out.definition && d.definition) out.definition = d.definition;
          if(d.example) out.examples.push(d.example);
          out.synonyms.push(...(d.synonyms||[]));
          out.antonyms.push(...(d.antonyms||[]));
        }
      }
    }
    out.example = out.examples[0] || '';
    return out;
  }

  async function fetchDatamuse(word, rel){
    const res = await fetchTimeout(`https://api.datamuse.com/words?rel_${rel}=${encodeURIComponent(word)}&max=9`);
    if(!res.ok) return [];
    return (await res.json()).map(d => d.word);
  }

  function dedupe(list, exclude){
    const seen = new Set(), ex = Utils.norm(exclude);
    return list.map(s => String(s).trim()).filter(s => {
      const n = Utils.norm(s);
      if(!n || n === ex || seen.has(n)) return false;
      seen.add(n); return true;
    }).slice(0, 9);
  }

  /* Повний перегляд слова у зовнішніх джерелах */
  async function lookup(word){
    const r = {phonetic:'', pos:'', definition:'', example:'', synonyms:[], antonyms:[], examples:[]};
    try{
      const d = await fetchDictionary(word);
      if(d) Object.assign(r, d);
    }catch(e){}
    try{
      if(r.synonyms.length < 4) r.synonyms.push(...await fetchDatamuse(word, 'syn'));
      if(r.antonyms.length < 2) r.antonyms.push(...await fetchDatamuse(word, 'ant'));
    }catch(e){}
    r.synonyms = dedupe(r.synonyms, word);
    r.antonyms = dedupe(r.antonyms, word);
    r.examples = dedupe(r.examples, '');
    return (r.definition || r.synonyms.length || r.examples.length) ? r : null;
  }

  /* Доповнює слово в базі даними зі словника — а якщо слова там немає
     і підключений ключ Claude, добирає ті самі дані через AI */
  async function enrich(id){
    const w = Store.get(id);
    if(!w) return null;
    let r = await lookup(w.word);
    if((!r || (!r.definition && !r.synonyms.length)) && hasAI()){
      try{
        const ai = await aiLookup(w.word);
        if(ai.definition || ai.synonyms.length || ai.translation) r = ai;
      }catch(e){ /* AI недоступний — лишаємось із тим, що дав словник (або нічим) */ }
    }
    if(!r) return null;
    if(!w.phonetic)    w.phonetic = r.phonetic;
    if(!w.pos)         w.pos = r.pos;
    if(!w.definition)  w.definition = r.definition;
    if(!w.example)     w.example = r.example;
    if(!w.translation && r.translation) w.translation = r.translation;
    if(r.synonyms.length) w.synonyms = r.synonyms;
    if(r.antonyms.length) w.antonyms = r.antonyms;
    w.enriched = true;
    Store.save();
    return w;
  }

  /* ---------- Claude (опційно) ---------- */
  function hasAI(){ return !!Store.db.settings.apiKey; }

  async function claude(prompt, maxTokens = 2000){
    const s = Store.db.settings;
    if(!s.apiKey) throw new Error('Не вказано ключ Claude API');

    const model = s.model || 'claude-opus-5';
    /* effort і server-side fallback підтримують не всі моделі —
       claude-haiku-4-5 повертає помилку на обидва параметри */
    const supportsExtras = model !== 'claude-haiku-4-5';

    const body = {
      model,
      max_tokens: maxTokens,
      messages:[{role:'user', content: prompt}]
    };
    if(supportsExtras){
      body.output_config = { effort:'low' };
      body.fallbacks = 'default';
    }

    const headers = {
      'content-type':'application/json',
      'x-api-key': s.apiKey,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    };
    if(supportsExtras) headers['anthropic-beta'] = 'server-side-fallback-2026-07-01';

    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers,
      body: JSON.stringify(body)
    });

    if(!res.ok){
      const t = await res.text();
      let msg = `HTTP ${res.status}`;
      try{ msg = JSON.parse(t).error?.message || msg; }catch(e){}
      throw new Error(msg);
    }
    const data = await res.json();
    if(data.stop_reason === 'refusal') throw new Error('Модель відхилила запит');
    return (data.content||[]).filter(b => b.type === 'text').map(b => b.text).join('').trim();
  }

  function parseJSON(text){
    const c = text.replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
    const s = c.search(/[[{]/);
    if(s === -1) throw new Error('Відповідь без JSON');
    const e = Math.max(c.lastIndexOf(']'), c.lastIndexOf('}'));
    return JSON.parse(c.slice(s, e+1));
  }

  /* Пояснення різниці між словом і його синонімом — як екран Compare with */
  async function compare(word, other){
    const prompt =
`Explain the difference between the English words "${other}" and "${word}" for a learner.
Write 3 short paragraphs in English:
1. What "${other}" means.
2. Another angle on what "${other}" means or when it is used.
3. How "${other}" differs from "${word}" in practice.

Return ONLY JSON, no explanations:
{"paragraphs": ["...", "...", "..."]}`;
    const obj = parseJSON(await claude(prompt, 1200));
    if(!Array.isArray(obj.paragraphs)) throw new Error('Неочікувана відповідь');
    return obj.paragraphs;
  }

  /* Переклад + приклад для слова без даних */
  async function describe(word){
    const prompt =
`Для англійського слова "${word}" дай:
- переклад українською (коротко, 1-3 варіанти через кому)
- просте визначення англійською
- одне природне речення-приклад англійською з цим словом

Поверни ЛИШЕ JSON без пояснень:
{"translation":"...","definition":"...","example":"..."}`;
    return parseJSON(await claude(prompt, 800));
  }

  /* Повна генерація даних для слова, якого немає у відкритих словниках
     (сленг, рідкісне слово, неологізм тощо) — переклад, визначення, приклад,
     синоніми й антоніми одним запитом через Claude. Форма відповіді сумісна
     з lookup(), плюс поле translation, якого відкриті словники не дають. */
  async function aiLookup(word){
    const prompt =
`Для англійського слова "${word}", якого може не бути у стандартних словниках,
згенеруй повні дані для картки вивчення мови:
- переклад українською (коротко, 1-3 варіанти через кому)
- частина мови скорочено англійською (n, v, adj, adv тощо)
- просте визначення англійською
- одне природне речення-приклад англійською з цим словом
- до 5 синонімів англійською (лише якщо реально існують, інакше порожній масив)
- до 5 антонімів англійською (лише якщо реально існують, інакше порожній масив)

Поверни ЛИШЕ JSON без пояснень:
{"translation":"...","pos":"...","definition":"...","example":"...","synonyms":["..."],"antonyms":["..."]}`;
    const obj = parseJSON(await claude(prompt, 900));
    return {
      phonetic: '',
      pos: obj.pos || '',
      definition: obj.definition || '',
      example: obj.example || '',
      examples: obj.example ? [obj.example] : [],
      synonyms: Array.isArray(obj.synonyms) ? obj.synonyms.slice(0, 9) : [],
      antonyms: Array.isArray(obj.antonyms) ? obj.antonyms.slice(0, 9) : [],
      translation: obj.translation || ''
    };
  }

  /* Текст для читання, у який природно вплетені слова, що зараз вивчаються */
  async function generateText({words, level, topic, length}){
    const list = words.map(w => w.word).join(', ');
    const prompt =
`Напиши текст англійською мовою для того, хто вивчає англійську на рівні ${level}.
${topic ? `Тема: ${topic}.` : "Тему обери самостійно — цікаву й побутову."}
Довжина: приблизно ${length} слів.

${list
  ? `Природно вплети у текст ці слова, якщо вони пасують до теми (не обов'язково всі до одного, головне — щоб текст читався природно): ${list}.\nКожне вжите слово має стояти у звичайному, типовому для нього контексті.`

      App.render();
    },

/* Спільний крок тріажу: позначаємо слово й гортаємо далі.
   «Вже знаю» одразу переводить у mastered (з повними сегментами прогресу),
   «Треба вчити» ставить у чергу вивчення (learning, без дати повторення). */
function triageStep(status){
  const p = App.params();
  const w = Store.get(p.queue[p.at]);
  if(w){
    w.status = status;
    w.nextReview = null;
    if(status === 'mastered') w.timesRemembered = SRS.LADDER.length;
    Store.addGems(1);
    Store.logDay('triaged');
    Store.save();
  }

  /* наступне ще не опрацьоване слово в цій смузі */
  let next = -1;
  for(let i = p.at + 1; i < p.queue.length; i++){
    const x = Store.get(p.queue[i]);
    if(x && x.status === 'new'){ next = i; break; }
  }

  if(next === -1){
    Utils.toast(status === 'mastered' ? 'Позначено як вивчене' : 'Додано у список на вивчення', 'ok');
    App.back();
  } else {
    App.replace('triage', {queue: p.queue, at: next});
  }
}

/* ---------- допоміжні ---------- */
function cap(s){ return String(s).charAt(0).toUpperCase() + String(s).slice(1); }

function panel(title, items, color){
  return `<div class="card">
    <div class="dim" style="text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">${title}</div>
    <div class="chips" style="justify-content:flex-start">
      ${items.map(x => `<span class="chip" style="color:${color}">${Utils.esc(x)}</span>`).join('')}
    </div>
  </div>`;
}

function seg(w){
  const n = Math.min(w.timesRemembered, SRS.SEGMENTS);
  return Array.from({length: SRS.SEGMENTS}, (_, i) =>
    `<i class="${w.status === 'mastered' ? 'max' : i < n ? 'on' : ''}"></i>`).join('');
}

function statusLabel(w){
  if(w.status === 'learning') return w.nextReview ? 'вивчаю' : 'у черзі на вивчення';
  return { new:'не опрацьоване', mastered:'вивчено' }[w.status];
}

function highlight(sentence, word){
  const safe = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return Utils.esc(sentence).replace(new RegExp(`\\b(${safe}\\w*)\\b`, 'gi'), '<b>$1</b>');
}

/* Підсвічує у поясненні порівнюване слово (бірюзовий) та основне (фіолетовий) */
function colorize(text, a, b){
  let out = Utils.esc(text);
  const wrap = (w, cls) => {
    const safe = w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    out = out.replace(new RegExp(`\\b(${safe}\\w*)\\b`, 'gi'), `<span class="${cls}">$1</span>`);
  };
  wrap(a, 'a');
  wrap(b, 'b');
  return out;
}

      /* у кінець черги: знижуємо пріоритет, лишаючи слово в списку */
      w.rank = Math.max(0, ...Store.db.words.map(x => x.rank)) + 1;
      Store.save(); App.render();
    }
  }
});

/* ---------- нижній лист планування ---------- */
function openScheduleSheet(w, afterSave){
  const rec = SRS.recommendedOption(w);
  const recDays = SRS.recommendedDays(w);
  const times = w.timesRemembered;

  App.sheet(`
    <h2>${Utils.esc(w.word)}</h2>
    <div class="sub">Разів згадано: ${times === 0 ? 'жодного' : times}</div>
    <div style="font-weight:600;margin-bottom:6px">Наступне повторення:</div>
    ${SRS.OPTIONS.map(o => `
      <label class="radio">
        <input type="radio" name="ivl" value="${o.id}" ${o.id === rec ? 'checked' : ''}>
        <span>${o.label}${o.id === rec ? ' <span class="rec">(рекомендовано)</span>' : ''}</span>
      </label>`).join('')}
    <label class="radio">
      <input type="radio" name="ivl" value="custom" id="ivl-custom">
      <span>Свій варіант: через
        <input type="number" id="custom-days" min="1" max="1000" value="${recDays}"
               style="width:64px;display:inline-block;margin:0 4px"
               oninput="document.getElementById('ivl-custom').checked=true">
        дн.</span>
    </label>
    <button class="btn violet" data-act="confirmSchedule" style="margin-top:16px">Продовжити</button>
  `, {
    confirmSchedule(){
      const sel = document.querySelector('input[name=ivl]:checked');
      const selId = sel ? sel.value : rec;

      let days;
      if(selId === 'custom'){
        const n = parseInt(document.getElementById('custom-days').value, 10);
        days = n > 0 ? n : recDays;
      } else {
        const opt = SRS.OPTIONS.find(o => o.id === selId);
        days = opt ? opt.days : recDays;
      }

      SRS.remember(w, days);
      Store.addGems(1);
      Store.logDay('learned');
      Store.save();
      if(afterSave) afterSave();
      App.closeSheet();

      const msg = days === null ? 'Слово вивчено 🎓' : 'Повторимо ' + Utils.fmtWhen(w.nextReview);
      Utils.toast(msg, 'ok');

      /* з екрана вивчення повертаємось до наступного слова */
      if(App.top().view === 'study') App.back();
      else App.render();
    }
  });
}

function timesLabel(w){
  const n = w.timesRemembered;
  if(n === 0) return 'Ще не вчили';
  if(n === 1) return 'Один раз';
  return `${n} раз${n < 5 ? 'и' : 'ів'}`;
}

/* views/tests.js — тести для слів, які стоять у черзі на вивчення.
   Кожен тип оголошує, яким словам він підходить (fits) і як зібрати запитання (build). */

const TEST_TYPES = {
  en_ua: {
    label:'Слово → переклад', hint:'обрати правильний переклад',
    fits: w => !!w.translation,
    build(w, pool){
      return {kind:'choice',
        prompt:`Як перекладається <b>${Utils.esc(w.word)}</b>?`,
        correct:w.translation,
        options:withDistractors(w.translation, pool.map(x => x.translation))};
    }
  },

  ua_en: {
    label:'Переклад → слово', hint:'обрати правильне англійське слово',
    fits: w => !!w.translation,
    build(w, pool){
      return {kind:'choice',
        prompt:`Яке англійське слово означає <b>${Utils.esc(w.translation)}</b>?`,
        correct:w.word,
        options:withDistractors(w.word, pool.map(x => x.word))};
    }
  },

  cloze: {
    label:'Слово в реченні', hint:'вставити пропущене слово',
    fits: w => !!sentenceFor(w),
    build(w, pool){
      const gapped = Utils.esc(sentenceFor(w))
        .replace(new RegExp(`\\b${escRe(w.word)}\\w*\\b`, 'i'), '<span class="gap"></span>');
      return {kind:'choice',
        prompt:`Вставте пропущене слово:<br><i style="color:var(--muted)">${gapped}</i>`,
        correct:w.word,
        options:withDistractors(w.word, pool.map(x => x.word))};
    }
  },

  typing: {
    label:'Написати вручну', hint:'ввести слово з клавіатури',
    fits: w => !!w.translation,
    build(w){
      return {kind:'typing',
        prompt:`Напишіть англійською: <b>${Utils.esc(w.translation)}</b>`,
        correct:w.word};
    }
  },

  spelling: {
    label:'Правильне написання', hint:'обрати варіант без помилок',
    fits: w => w.word.length >= 5 && /^[a-z]+$/i.test(w.word),
    build(w){
      return {kind:'choice',
        prompt:`Який варіант написано правильно? <span class="muted">(${Utils.esc(w.translation)})</span>`,
        correct:w.word,
        options:Utils.shuffle([w.word, ...misspellings(w.word, 3)])};
    }
  },

  definition: {
    label:'Слово за визначенням', hint:'впізнати слово з англійського опису',
    fits: w => !!w.definition,
    build(w, pool){
      return {kind:'choice',
        prompt:`Яке слово підходить під опис?<br><i style="color:var(--muted)">${Utils.esc(w.definition)}</i>`,
        correct:w.word,
        options:withDistractors(w.word, pool.map(x => x.word))};
    }
  },

  defcard: {
    label:'Слово → визначення', hint:'обрати правильне визначення карткою',
    fits: w => !!w.definition,
    build(w, pool){
      const distractPool = pool.filter(x => x.id !== w.id && x.definition && x.definition !== w.definition);
      const distractors = Utils.pick(distractPool, 2).map(x => x.definition);
      if(distractors.length < 2) return null;
      return {kind:'defcard',
        prompt:`Оберіть визначення до слова <b>${Utils.esc(w.word)}</b>`,
        correct:w.definition,
        options:Utils.shuffle([w.definition, ...distractors])};
    }
  },

  listen: {
    label:'Прослухати й обрати', hint:'на слух вибрати правильне написання',
    fits: w => w.word.length >= 4 && /^[a-z]+$/i.test(w.word),
    build(w){
      return {kind:'listen',
        prompt:'Прослухайте слово і оберіть правильне написання',
        correct:w.word,
        options:Utils.shuffle([w.word, ...misspellings(w.word, 3)])};
    }
  },

  synonym: {
    label:'Синонім', hint:'обрати слово з близьким значенням',
    fits: w => w.synonyms && w.synonyms.length > 0,
    build(w, pool){
      const correct = Utils.pick(w.synonyms, 1)[0];
      const others = pool.filter(x => x.id !== w.id).map(x => x.word)
        .concat(pool.flatMap(x => x.id !== w.id ? (x.antonyms || []) : []));
      return {kind:'choice',
        prompt:`Яке слово найближче за значенням до <b>${Utils.esc(w.word)}</b>?`,
        correct, options:withDistractors(correct, others)};
    }
  },

  antonym: {
    label:'Антонім', hint:'обрати протилежне за значенням',
    fits: w => w.antonyms && w.antonyms.length > 0,
    build(w, pool){
      const correct = Utils.pick(w.antonyms, 1)[0];
      const others = pool.filter(x => x.id !== w.id).map(x => x.word).concat(w.synonyms || []);
      return {kind:'choice',
        prompt:`Яке слово протилежне за значенням до <b>${Utils.esc(w.word)}</b>?`,
        correct, options:withDistractors(correct, others)};
    }
  }
};

Views.register('tests', {
  title: 'Тести',
  tab: 'tests',
  form: { scope:'toLearn', count:'10' },
  state: {
    enabled: Object.keys(TEST_TYPES).reduce((a,k) => (a[k] = true, a), {}),
    quiz: null, answered: null, typed: ''
  },

  render(){
    const s = this.state;
    if(s.quiz && s.quiz.i >= s.quiz.qs.length) return this.summary();
    if(s.quiz) return this.question();
    return this.setup();
  },

  /* ---------- налаштування ---------- */
  setup(){
    const s = this.state, f = this.form;
    const pool = this.pool();
    const st = Store.stats();

    if(pool.length < 4){
      return `
      <div class="empty">
        <div class="big">🧪</div>
        У цій вибірці лише ${pool.length} ${pool.length === 1 ? 'слово' : 'слів'} — для тесту потрібно щонайменше 4.
        <div style="margin-top:8px" class="dim">
          Позначайте слова «Треба вчити» на карті знань, і вони потраплять сюди.
        </div>
        <div style="margin-top:22px" class="row" style="justify-content:center">
          <button class="btn cyan" data-act="toMap">Відкрити карту знань</button>
        </div>
      </div>`;
    }

    const typeRows = Object.entries(TEST_TYPES).map(([id, t]) => {
      const n = pool.filter(w => t.fits(w)).length;
      const off = n < 1;
      return `
      <label class="chk" style="${off ? 'opacity:.4' : ''}">
        <input type="checkbox" data-act="tgl" data-v="${id}" ${s.enabled[id] && !off ? 'checked' : ''} ${off ? 'disabled' : ''}>
        <span>${t.label} <span class="dim">— ${t.hint} · ${n}</span></span>
      </label>`;
    }).join('');

    return `
    <div class="split">
      <div>
        <div class="card">
          <h2>Що перевіряємо</h2>
          <label class="f"><span>Вибірка слів</span>
            <select data-model="scope">
              <option value="toLearn"${f.scope==='toLearn'?' selected':''}>У черзі на вивчення (${st.toLearn})</option>
              <option value="studying"${f.scope==='studying'?' selected':''}>Ті, що вивчаю (${st.studying})</option>
              <option value="due"${f.scope==='due'?' selected':''}>На повторення сьогодні (${st.due})</option>
              <option value="active"${f.scope==='active'?' selected':''}>Усі активні (черга + вивчаю)</option>
              <option value="mastered"${f.scope==='mastered'?' selected':''}>Вивчені — перевірка (${st.mastered})</option>
            </select>
          </label>
          <label class="f"><span>Кількість запитань</span>
            <select data-model="count">
              ${['5','10','20','40'].map(n=>`<option${f.count===n?' selected':''}>${n}</option>`).join('')}
            </select>
          </label>
          <label class="chk">
            <input type="checkbox" data-act="tglSrs" ${Store.db.settings.testsAffectSrs?'checked':''}>
            <span>Тести впливають на розклад
              <span class="dim">— правильна відповідь просуває слово, помилка повертає на завтра</span></span>
          </label>
          <button class="btn cyan wide" data-act="start" style="margin-top:6px">
            Почати тест · ${pool.length} слів доступно
          </button>
        </div>
      </div>

      <div>
        <div class="card">
          <h2>Типи запитань</h2>
          ${typeRows}
          <div class="dim" style="margin-top:10px;line-height:1.6">
            Типи, для яких бракує даних, вимкнені. Визначення, приклади, синоніми
            й антоніми підтягуються з відкритих словників — натисніть 🔍 у картці слова
            або увімкніть автозбагачення в «Ще».
          </div>
        </div>
      </div>
    </div>`;
  },

  /* ---------- запитання ---------- */
  question(){
    const s = this.state;
    const q = s.quiz.qs[s.quiz.i];
    const a = s.answered;
    const pct = Math.round(s.quiz.i / s.quiz.qs.length * 100);

    /* «Далі» показуємо лише після помилки — правильну відповідь застосунок
       гортає сам, без зупинки на кнопці */
    const nextBtn = (a && !a.ok) ? `<div class="row" style="margin-top:10px"><button class="btn cyan" id="next-btn" data-act="next">Далі →</button></div>` : '';

    let body;
    if(q.kind === 'typing'){
      body = `<input id="tin" value="${Utils.esc(s.typed)}" placeholder="введіть слово англійською"
                autocomplete="off" autocapitalize="off" spellcheck="false" ${a?'disabled':''}>
         ${a ? `<div class="tresult ${a.ok?'ok':'no'}">
                  ${a.ok ? '✓ Правильно!'
                         : `✕ Ви написали «${Utils.esc(a.val)}». Правильно: <span class="right">${Utils.esc(q.correct)}</span>`}
                </div>` : ''}
         <div class="row" style="margin-top:16px">
           ${a ? (a.ok ? '' : `<button class="btn cyan" id="next-btn" data-act="next">Далі →</button>`)
               : `<button class="btn cyan" data-act="submit">Перевірити</button>`}
         </div>`;
    } else if(q.kind === 'listen'){
      body = `
        <div class="center" style="padding:8px 0 22px">
          <button class="playbtn" data-act="playWord">${a ? '🔊' : '▶'}</button>
        </div>
        ${q.options.map(o => {
          let c = 'optbtn';
          if(a){ if(o === q.correct) c += ' correct'; else if(o === a.val) c += ' wrong'; }
          return `<button class="${c}" data-act="answer" data-v="${Utils.esc(o)}" ${a?'disabled':''}>${Utils.esc(o)}</button>`;
        }).join('')}
        ${nextBtn}`;
    } else if(q.kind === 'defcard'){
      body = q.options.map(o => {
        let c = 'defcard';
        if(a){ if(o === q.correct) c += ' correct'; else if(o === a.val) c += ' wrong'; }
        return `<button class="${c}" data-act="answer" data-v="${Utils.esc(o)}" ${a?'disabled':''}>
          <span class="dc-thumb" style="background:${Utils.cover(o)}"></span>
          <span class="dc-text">${Utils.esc(o)}</span>
        </button>`;
      }).join('') + nextBtn;
    } else {
      body = q.options.map(o => {
        let c = 'optbtn';
        if(a){ if(o === q.correct) c += ' correct'; else if(o === a.val) c += ' wrong'; }
        return `<button class="${c}" data-act="answer" data-v="${Utils.esc(o)}" ${a?'disabled':''}>${Utils.esc(o)}</button>`;
      }).join('') + nextBtn;
    }

    return `
    <div class="wrap narrow">
      <div class="progressbar"><div style="width:${pct}%"></div></div>
      <div class="card qcard" data-qkey="${s.quiz.i}">
        <div class="qkind">${TEST_TYPES[q.type].label}</div>
        <div class="qtitle">${q.prompt}</div>
        ${body}
      </div>
      <div class="row between">
        <span class="muted">Запитання ${s.quiz.i + 1} / ${s.quiz.qs.length}</span>
        <span class="muted">Правильних: ${s.quiz.score}</span>
      </div>
    </div>`;
  },

  /* ---------- підсумок ---------- */
  summary(){
    const q = this.state.quiz;
    const pct = Math.round(q.score / q.qs.length * 100);
    const wrong = q.qs.filter(x => x.wrong);

    return `
    <div class="wrap narrow">
      <div class="card center">
        <div style="font-size:52px">${pct >= 80 ? '🎉' : pct >= 50 ? '👍' : '💪'}</div>
        <h2 style="margin-top:8px">Результат тесту</h2>
        <div class="statgrid" style="margin-top:14px">
          <div class="stat"><b>${q.score}/${q.qs.length}</b><span>правильних</span></div>
          <div class="stat"><b style="color:var(--cyan)">${pct}%</b><span>результат</span></div>
          <div class="stat"><b style="color:var(--bad)">${wrong.length}</b><span>помилок</span></div>
        </div>
      </div>

      ${wrong.length ? `
      <div class="card">
        <h2>Над чим попрацювати</h2>
        <div class="mistakes">
          ${wrong.map(x => {
            const w = Store.get(x.wordId);
            return `<div class="mistake">
              <b>${Utils.esc(w ? w.word : '')}</b>
              <span class="muted">правильно: ${Utils.esc(x.correct)}</span>
            </div>`;
          }).join('')}
        </div>
      </div>` : ''}

      <div class="row">
        <button class="btn cyan" data-act="restart">Новий тест</button>
        ${wrong.length ? `<button class="btn ghost" data-act="retry">Перепройти помилки</button>` : ''}
        <button class="btn ghost" data-act="toReview">До повторень</button>
      </div>
    </div>`;
  },

  mount(){
    const inp = document.getElementById('tin');
    if(inp && !this.state.answered){
      inp.focus();
      inp.onkeydown = ev => { if(ev.key === 'Enter'){ ev.preventDefault(); this.actions.submit(); } };
    }

    const s = this.state;
    if(s.quiz && s.quiz.i < s.quiz.qs.length){
      const q = s.quiz.qs[s.quiz.i];
      if(q.kind === 'listen' && !s.answered) Utils.speakForce(q.correct);
    }
  },

  /* слова згідно з обраною вибіркою.
     Обидва «toLearn»/«studying» — це підмножини статусу 'learning',
     розрізнені наявністю дати наступного повторення. */
  pool(){
    const f = this.form;
    const all = Store.db.words;
    if(f.scope === 'toLearn')  return all.filter(w => w.status === 'learning' && !w.nextReview);
    if(f.scope === 'studying') return all.filter(w => w.status === 'learning' && !!w.nextReview);
    if(f.scope === 'due')      return Store.due();
    if(f.scope === 'mastered') return all.filter(w => w.status === 'mastered');
    return all.filter(w => w.status === 'learning');
  },

  actions: {
    toMap(){ App.go('map'); },
    toReview(){ App.go('review'); },
    tgl(el, ds){ Views.map.tests.state.enabled[ds.v] = el.checked; },
    tglSrs(el){ Store.db.settings.testsAffectSrs = el.checked; Store.save(); },

    playWord(){
      const s = Views.map.tests.state;
      const q = s.quiz.qs[s.quiz.i];
      Utils.speakForce(q.correct);
    },

    start(){
      const v = Views.map.tests, s = v.state;
      const pool = v.pool();
      if(pool.length < 4){ Utils.toast('Замало слів у вибірці', 'err'); return; }

      const types = Object.keys(TEST_TYPES).filter(k => s.enabled[k]);
      if(!types.length){ Utils.toast('Оберіть хоча б один тип запитань', 'err'); return; }

      const total = Math.min(+v.form.count, pool.length * 2);
      const bag = Utils.shuffle(pool);
      const qs = [];
      let guard = 0;

      while(qs.length < total && guard++ < total * 14){
        const w = bag[qs.length % bag.length];
        const usable = types.filter(t => TEST_TYPES[t].fits(w));
        if(!usable.length) continue;
        const type = Utils.pick(usable, 1)[0];
        const q = TEST_TYPES[type].build(w, pool);
        if(!q || (q.options && q.options.length < 2)) continue;
        q.type = type; q.wordId = w.id;
        qs.push(q);
      }

      if(!qs.length){ Utils.toast('Не вдалося скласти запитання', 'err'); return; }
      s.quiz = {qs: Utils.shuffle(qs), i:0, score:0};
      s.answered = null; s.typed = '';
      App.render();
    },

    answer(el, ds){ grade(ds.v); },
    submit(){ grade((document.getElementById('tin')?.value || '').trim()); },

    next(){ advance(); },

    restart(){
      const s = Views.map.tests.state;
      s.quiz = null; s.answered = null; s.typed = '';
      App.render();
    },

    retry(){
      const s = Views.map.tests.state;
      const wrong = s.quiz.qs.filter(x => x.wrong).map(x => ({...x, wrong:false}));
      s.quiz = {qs: Utils.shuffle(wrong), i:0, score:0};
      s.answered = null; s.typed = '';
      App.render();
    }
  }
});

/* Переходить до наступного питання (або підсумку) й скидає стан відповіді */
function advance(){
  const s = Views.map.tests.state;
  s.quiz.i++; s.answered = null; s.typed = '';
  App.render();
}

/* ---------- перевірка відповіді ---------- */
function grade(val){
  const s = Views.map.tests.state;
  if(s.answered) return;
  const q = s.quiz.qs[s.quiz.i];
  const qi = s.quiz.i;

  const ok = q.kind === 'typing'
    ? Utils.norm(val) === Utils.norm(q.correct)
    : val === q.correct;

  s.answered = {val, ok};
  s.typed = val;
  if(ok) s.quiz.score++; else q.wrong = true;

  const w = Store.get(q.wordId);
  if(w && Store.db.settings.testsAffectSrs){
    if(ok){
      /* правильна відповідь просуває слово далі за рекомендованим інтервалом
         (враховуючи бонус за «чистий» без помилок день) */
      SRS.remember(w, SRS.recommendedDays(w));
      Store.addGems(1);
      Store.logDay('reviewed');
    } else {
      /* помилка завжди повертає слово в активне повторення на завтра —
         навіть якщо воно щойно було «нове» чи вже «вивчене» */
      SRS.forget(w);
      Store.logDay('reviewed');
    }
    Store.save();
  }

  App.render();
  if(w) Utils.speak(w.word);

  /* правильну відповідь не зупиняємо кнопкою — коротко показуємо зелену
     підсвітку і одразу гортаємо далі. Помилку показуємо і чекаємо на
     свідомий клік «Далі», щоб встигнути прочитати правильну відповідь. */
  if(ok){
    setTimeout(() => {
      if(App.top().view !== 'tests') return;
      if(!s.quiz || s.quiz.i !== qi) return;   // питання вже змінилось іншим шляхом
      advance();
    }, 550);
  }
}

/* ---------- допоміжні ---------- */
function withDistractors(correct, candidates){
  const seen = new Set([Utils.norm(correct)]);
  const out = [];
  for(const c of Utils.shuffle(candidates)){
    const n = Utils.norm(c);
    if(!n || seen.has(n)) continue;
    seen.add(n); out.push(c);
    if(out.length === 3) break;
  }
  return Utils.shuffle([correct, ...out]);
}

function sentenceFor(w){
  const re = new RegExp(`\\b${escRe(w.word)}`, 'i');
  return (w.example && re.test(w.example)) ? w.example : '';
}

function escRe(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

/* правдоподібні орфографічні помилки для тесту на написання */
function misspellings(word, n){
  const out = new Set(), w = word.toLowerCase(), vow = 'aeiou';
  const variants = [
    () => { const i = 1 + Math.floor(Math.random() * Math.max(1, w.length-2));
            return w.slice(0,i) + w[i+1] + w[i] + w.slice(i+2); },
    () => { const i = 1 + Math.floor(Math.random() * (w.length-1));
            return w.slice(0,i) + w[i] + w.slice(i); },
    () => { const i = 1 + Math.floor(Math.random() * (w.length-2));
            return w.slice(0,i) + w.slice(i+1); },
    () => { const ix = [...w].map((c,i) => vow.includes(c) ? i : -1).filter(i => i > 0);
            if(!ix.length) return '';
            const i = ix[Math.floor(Math.random()*ix.length)];
            const alt = vow.replace(w[i], '');
            return w.slice(0,i) + alt[Math.floor(Math.random()*alt.length)] + w.slice(i+1); }
  ];
  let g = 0;
  while(out.size < n && g++ < 50){
    const c = variants[g % variants.length]();
    if(c && c !== w && c.length > 2) out.add(c);
  }
  const cap = word[0] === word[0].toUpperCase();
  return [...out].slice(0, n).map(s => cap ? s[0].toUpperCase() + s.slice(1) : s);
}

/* ---------- віджети трекінгу ---------- */

/* Скільки слів настане в кожен з наступних 14 днів */
function forecast(){
  const today = Utils.today();
  const days = [];
  const overdue = Store.db.words.filter(w => w.status === 'learning' && w.nextReview && w.nextReview < today).length;

  for(let i = 0; i < 14; i++){
    const d = Utils.addDays(today, i);
    const n = Store.db.words.filter(w => w.status === 'learning' && w.nextReview === d).length;
    days.push({d, n, i});
  }
  if(overdue) days[0].n += overdue;

  const max = Math.max(1, ...days.map(x => x.n));
  const names = ['нд','пн','вт','ср','чт','пт','сб'];

  return `<div class="forecast">
    ${days.map(x => {
      const dt = new Date(x.d + 'T00:00:00');
      const cls = x.i === 0 ? (overdue ? 'over' : 'today') : '';
      return `<div class="col ${cls}" title="${x.d}: ${x.n}">
        <span class="vl">${x.n || ''}</span>
        <div class="bar" style="height:${Math.round(x.n / max * 100)}%"></div>
        <span class="lb">${x.i === 0 ? 'сьогодні' : names[dt.getDay()] + ' ' + dt.getDate()}</span>
      </div>`;
    }).join('')}
  </div>`;
}

/* Теплова мапа активності за 15 тижнів */
function heatmap(){
  const cells = [];
  const today = Utils.today();
  /* вирівнюємо початок на понеділок, щоб рядки збігалися з днями тижня */
  const shift = (new Date(today + 'T00:00:00').getDay() + 6) % 7;
  for(let i = 104 + shift; i >= 0; i--){
    const d = Utils.addDays(today, -i);
    const h = Store.db.history[d];
    const n = h ? (h.reviewed || 0) + (h.learned || 0) : 0;
    const lvl = n === 0 ? '' : n < 5 ? 'l1' : n < 12 ? 'l2' : n < 25 ? 'l3' : 'l4';
    cells.push(`<i class="${lvl}" title="${d}: ${n}"></i>`);
  }
  return `<div class="heat">${cells.join('')}</div>`;
}

/* Найближчі дати з переліком слів */
function schedulePreview(){
  const today = Utils.today();
  const map = {};
  Store.db.words
    .filter(w => w.status === 'learning' && w.nextReview && w.nextReview > today)
    .forEach(w => { (map[w.nextReview] = map[w.nextReview] || []).push(w.word); });

  const dates = Object.keys(map).sort().slice(0, 8);
  if(!dates.length) return `<div class="muted">Поки нічого не заплановано.</div>`;

  return dates.map(d => `
    <div class="row between" style="padding:9px 0;border-bottom:1px solid var(--line)">
      <div>
        <div style="font-size:14px">${Utils.fmtWhen(d)}</div>
        <div class="dim">${map[d].slice(0,4).map(Utils.esc).join(', ')}${map[d].length > 4 ? ` +${map[d].length-4}` : ''}</div>
      </div>
      <span class="duechip">${map[d].length}</span>
    </div>`).join('');
}

function dayStreak(){
  let n = 0;
  let cur = Utils.today();
  const active = d => { const h = Store.db.history[d]; return h && ((h.reviewed||0) + (h.learned||0)) > 0; };
  if(!active(cur)) cur = Utils.addDays(cur, -1);
  while(active(cur)){ n++; cur = Utils.addDays(cur, -1); }
  return n;
}

function nextUpText(){
  const next = Store.db.words
    .filter(w => w.status === 'learning' && w.nextReview)
    .sort((a,b) => a.nextReview.localeCompare(b.nextReview))[0];
  return next
    ? `Наступні слова — ${Utils.fmtWhen(next.nextReview)}.`
    : `Почніть вивчати слова, і вони з'являться тут за розкладом.`;
}

function plural(n, one, few, many){
  const a = n % 10, b = n % 100;
  if(a === 1 && b !== 11) return one;
  if(a >= 2 && a <= 4 && (b < 10 || b >= 20)) return few;
  return many;
}

function hl(sentence, word){
  const safe = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return Utils.esc(sentence).replace(new RegExp(`\\b(${safe}\\w*)\\b`, 'gi'), '<b>$1</b>');
}

        const words = pool.length ? Utils.pick(pool, Math.min(12, pool.length)) : [];

        App.render();

    readAloud(){
      const t = Store.getText(Views.map.reading.state.openId);
      if(t) Utils.speakForce(t.body);
    },

    /* натиснули слово в тексті */
    async token(el, ds){
      const v = Views.map.reading;
      const word = ds.w;
      v.state.lookup = {word, loading:true, data:null, context: sentenceAround(el), translation:''};
      App.render();

      try{
        const data = await Api.lookup(word);
        if(v.state.lookup && v.state.lookup.word === word) v.state.lookup.data = data;
      }catch(e){ /* словник недоступний — залишаємо ручне введення */ }
      finally{
        if(v.state.lookup) v.state.lookup.loading = false;
        App.render();
      }
    },

    closeLookup(){ Views.map.reading.state.lookup = null; App.render(); },
    speakLookup(){ const lk = Views.map.reading.state.lookup; if(lk) Utils.speak(lk.word); },

    async aiTranslate(){
      const v = Views.map.reading, lk = v.state.lookup;
      if(!lk) return;
      lk.translating = true; App.render();
      try{
        const res = await Api.describe(lk.word);
        lk.translation = res.translation || '';
        if(!lk.data) lk.data = {phonetic:'', definition:'', synonyms:[], antonyms:[]};
        if(!lk.data.definition) lk.data.definition = res.definition || '';
        Utils.toast('Підказку додано', 'ok');
      }catch(err){
        Utils.toast('Помилка: ' + err.message, 'err');
      }finally{
        lk.translating = false; App.render();
      }
    },

    addFromText(){
      const v = Views.map.reading, lk = v.state.lookup;
      if(!lk) return;
      const input = document.getElementById('lk-trans');
      const translation = (input?.value || '').trim();
      if(!translation){ Utils.toast('Введіть переклад', 'err'); return; }

      const w = Store.add({
        word: lk.word, translation,
        example: lk.context || '',
        synonyms: lk.data?.synonyms || [],
        antonyms: lk.data?.antonyms || [],
        definition: lk.data?.definition || '',
        phonetic: lk.data?.phonetic || '',
        pos: lk.data?.pos || ''
      });
      w.status = 'learning';
      w.enriched = !!lk.data;
      Store.save();

      v.state.lookup = null;
      App.render();
      Utils.toast(`«${lk.word}» додано у чергу вивчення`, 'ok');
    }
  }
});

/* ---------- допоміжні ---------- */

function countWords(s){ return s.trim().split(/\s+/).filter(Boolean).length; }

/* Частка слів тексту, що вже є у словнику */
function knownShare(body){
  const toks = body.toLowerCase().match(/[a-z']+/g) || [];
  if(!toks.length) return 0;
  const dict = new Set(Store.db.words.map(w => Utils.norm(w.word)));
  const hits = toks.filter(t => dict.has(t)).length;
  return Math.round(hits / toks.length * 100);
}

/* Розбиває текст на клікабельні слова й підсвічує ті, що вже у словнику.
   Екрануємо кожен шматок окремо, щоб не зіпсувати HTML-сутності. */
function tokenize(body){
  const dict = new Map();
  Store.db.words.forEach(w => dict.set(Utils.norm(w.word), w.status));

  const plain = s => Utils.esc(s).replace(/\n/g, '<br>');
  const re = /[A-Za-z][A-Za-z']*/g;
  let out = '', last = 0, m;

  while((m = re.exec(body)) !== null){
    out += plain(body.slice(last, m.index));
    const status = dict.get(m[0].toLowerCase());
    const cls = status === 'mastered' ? 'tok mastered' : status ? 'tok known' : 'tok';
    out += `<span class="${cls}" data-act="token"` +
           ` data-w="${Utils.esc(m[0].toLowerCase())}" data-at="${m.index}">${Utils.esc(m[0])}</span>`;
    last = m.index + m[0].length;
  }
  return out + plain(body.slice(last));
}

/* Витягує речення, у якому стоїть натиснуте слово, за його позицією в тексті */
function sentenceAround(el){
  const t = Store.getText(Views.map.reading.state.openId);
  if(!t || !el || el.dataset.at === undefined) return '';

  const body = t.body;
  const pos = parseInt(el.dataset.at, 10);
  const start = Math.max(
    body.lastIndexOf('.', pos - 1),
    body.lastIndexOf('!', pos - 1),
    body.lastIndexOf('?', pos - 1),
    body.lastIndexOf('\n', pos - 1)
  ) + 1;

  const ends = ['.', '!', '?'].map(ch => body.indexOf(ch, pos)).filter(i => i !== -1);
  const end = ends.length ? Math.min(...ends) + 1 : body.length;

  return body.slice(start, end).trim();
}

  actions: {
    async lookup(){

        if((!r || (!r.definition && !r.synonyms.length)) && Api.hasAI()){
          try{
            const ai = await Api.aiLookup(word);
            if(ai.definition || ai.translation){ r = ai; viaAI = true; }
          }catch(e){ /* AI недоступний — лишаємось без результату */ }
        }
        v.state.found = r;
        if(r){
          if(!v.form.translation && r.translation) v.form.translation = r.translation;
          if(!v.form.example && r.example) v.form.example = r.example;
