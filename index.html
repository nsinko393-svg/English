    },
    addAntChip(){
      const v = Views.map.more;
      const inp = document.getElementById('ant-input');
      const val = (inp?.value || '').trim();
      if(!val) return;
      if(!v.state.antList.some(x => Utils.norm(x) === Utils.norm(val))) v.state.antList.push(val);
      App.render();
    },
    removeSynChip(el, ds){
      const v = Views.map.more;
      v.state.synList.splice(+ds.i, 1);
      App.render();
    },
    removeAntChip(el, ds){
      const v = Views.map.more;
      v.state.antList.splice(+ds.i, 1);
      App.render();
    },
    tglAddAsWords(el){ Views.map.more.state.addAsWords = el.checked; },

    /* Додає слово, а якщо вказані синоніми/антоніми — за бажанням
       створює для кожного з них окрему картку в словнику. Дані для цих
       окремих слів добираються так само: спершу відкритий словник,
       якщо там нічого немає — AI (за наявності ключа). Кожне нове слово
       одразу отримує нагадування на завтра, без окремого етапу «черги». */
    async addWord(){
      const v = Views.map.more, f = v.form;
      const word = f.word.trim(), translation = f.translation.trim();
      if(!word || !translation){ Utils.toast('Потрібні слово і переклад', 'err'); return; }
      if(Store.has(word)){ Utils.toast(`«${word}» вже є у словнику`, 'err'); return; }

      v.state.addingWord = true; App.render();

      const d = v.state.found;
      const synonyms = uniqueWords(v.state.synList, d?.synonyms || []);
      const antonyms = uniqueWords(v.state.antList, d?.antonyms || []);

      const w = Store.add({
        word, translation, example: f.example.trim(),
        definition: d?.definition || '', phonetic: d?.phonetic || '',
        pos: d?.pos || '', synonyms, antonyms
      });
      w.status = 'learning';
      w.nextReview = Utils.addDays(Utils.today(), 1);   // нагадування — від завтра

      let created = 0;
      if(v.state.addAsWords !== false){
        const chips = uniqueWords(v.state.synList, v.state.antList);
        for(const chip of chips){
          if(Store.has(chip)) continue;
          let data = null;
          try{ data = await Api.lookup(chip); }catch(e){}
          if((!data || (!data.definition && !data.synonyms.length)) && Api.hasAI()){
            try{
              const ai = await Api.aiLookup(chip);
              if(ai.definition || ai.translation || ai.synonyms.length) data = ai;
            }catch(e){}
          }
          const nw = Store.add({
            word: chip,
            translation: data?.translation || '',
            definition: data?.definition || '',
            example: data?.example || '',
            phonetic: data?.phonetic || '',
            pos: data?.pos || '',
            synonyms: data?.synonyms || [],
            antonyms: data?.antonyms || []
          });
          nw.status = 'learning';
          nw.nextReview = Utils.addDays(Utils.today(), 1);
          nw.enriched = !!(data && (data.definition || data.synonyms.length));
          created++;
        }
      }
      Store.save();

      v.form.word = ''; v.form.translation = ''; v.form.example = '';
      v.state.found = null; v.state.synList = []; v.state.antList = []; v.state.addingWord = false;
      App.render();
      Utils.toast(
        created ? `«${word}» додано, ще ${created} слів окремо — усі на завтра`
                : `«${word}» додано, нагадування — завтра`,
        'ok'
      );

    wipe(){

    enrichAll(){

      if(v.state.bulk && v.state.bulk.running) return;

      const targets = wordsNeedingData();
      if(!targets.length){ Utils.toast('Усі слова вже мають визначення й приклади', 'ok'); return; }

      v.state.bulk = {running:true, done:0, total:targets.length, added:0, cancel:false};
      App.render();

    cancelEnrich(){

      if(v.state.bulk) v.state.bulk.cancel = true;
    },

    async connectFirebase(){
      const v = Views.map.more;
      const raw = v.form.fbConfig.trim();
      if(!raw){ Utils.toast('Вставте конфігурацію проєкту', 'err'); return; }

      v.state.cloudBusy = true; App.render();
      try{
        const cfg = await Cloud.configure(raw);

        Store.db.settings.cloudDisabled = false;
        Store.save();
        startCloudWatch();
        Utils.toast('Підключено — дані тепер спільні й живі', 'ok');
      }catch(err){
        Utils.toast('Не вдалося підключити: ' + err.message, 'err');
      }finally{
        v.state.cloudBusy = false; App.render();
      }
    },

    forgetFirebase(){
      App.confirm('Відключити спільний сервер? Локальні дані на цьому пристрої залишаться недоторканими.', () => {
        Store.db.settings.firebaseConfig = '';
        Store.db.settings.cloudDisabled = true;
        Store.save();
        location.reload();   // найпростіший спосіб коректно «забути» вже завантажений SDK
      });
    },

    async cloudPush(){
      const v = Views.map.more;
      v.state.cloudBusy = true; App.render();
      try{ await Cloud.push(Store.db); Utils.toast('Синхронізовано', 'ok'); }
      catch(err){ Utils.toast('Помилка: ' + err.message, 'err'); }
      finally{ v.state.cloudBusy = false; App.render(); }

/* Підписка на живі оновлення спільного документа. Коли хтось (включно з
   нами з іншої вкладки чи пристрою) змінює дані — застосовуємо їх одразу. */
function startCloudWatch(){
  Cloud.watch(remoteData => {
    if(!remoteData || !Array.isArray(remoteData.words)) return;
    Store.importObject(remoteData);
    App.render(true);
    Utils.toast('Дані оновлено з сервера');
  });
}

/* Тягне дані з відкритих словників для великої кількості слів одразу.
   Обмежена паралельність, щоб не заспамити безкоштовний API запитами. */
async function runBulkEnrich(targets, bulk){
  const CONCURRENCY = 5;
  let idx = 0;

  /* прогрес оновлюємо періодично, а не на кожне слово — 365 повних
     перемальовувань екрана поспіль були б помітно повільними */
  const ticker = setInterval(() => {
    if(App.top().view === 'more') App.render();
  }, 400);

  async function worker(){
    while(idx < targets.length && !bulk.cancel){
      const w = targets[idx++];
      try{
        const r = await Api.enrich(w.id);
        if(r) bulk.added++;
      }catch(e){ /* пропускаємо слово, якщо словник не відповів */ }
      bulk.done++;
    }
  }

  await Promise.all(Array.from({length: CONCURRENCY}, worker));
  clearInterval(ticker);
  bulk.running = false;

  if(App.top().view === 'more') App.render();
  Utils.toast(
    bulk.cancel ? `Зупинено на ${bulk.done} / ${bulk.total}` : `Збагачено ${bulk.added} з ${bulk.total}`,
    'ok'
  );
}

/* Слова, яким бракує визначення й прикладу — саме те, чого потребують тести
   «Слово в реченні», «За визначенням» і карточки визначень. Навмисно НЕ
   спираємось на прапор `enriched`: коли dictionaryapi.dev тимчасово
   недоступний (трапляється), слово може отримати лише синоніми з Datamuse
   і назавжди зникнути з черги збагачення, так і не діставши приклад. */
function wordsNeedingData(){
  return Store.db.words.filter(w => !w.definition && !w.example);
}

/* Об'єднує кілька списків слів в один без повторів (порівняння без регістру) */
function uniqueWords(...lists){
  const seen = new Set(), out = [];
  for(const list of lists) for(const x of (list || [])){
    const n = Utils.norm(x);
    if(n && !seen.has(n)){ seen.add(n); out.push(String(x).trim()); }
  }
  return out;
}

function doImport(raw, listName){
  try{
    const r = Store.importTable(raw, listName || null);
    if(!r.added && !r.skipped){ Utils.toast('Не знайдено жодного рядка', 'err'); return; }
    Utils.toast(`Додано ${r.added}, вже було ${r.skipped}`, 'ok');
  }catch(e){
    Utils.toast('Помилка імпорту: ' + e.message, 'err');
  }
}

/* app.js — стек навігації, бічне меню, делеговані події */

const App = (function(){

  const TABS = [
    {id:'map',     view:'map',     icon:'🗺', label:'Карта знань'},
    {id:'learn',   view:'learn',   icon:'🎓', label:'Вчити'},
    {id:'tests',   view:'tests',   icon:'🧪', label:'Тести'},
    {id:'review',  view:'review',  icon:'🔁', label:'Повторення'},
    {id:'reading', view:'reading', icon:'📖', label:'Читання'},
    {id:'lists',   view:'lists',   icon:'📋', label:'Набори'},
    {id:'more',    view:'more',    icon:'⚙️', label:'Ще'}
  ];

  /* окремий стек екранів на кожен розділ */
  const stacks = {};
  TABS.forEach(t => stacks[t.id] = [{view: t.view, params: {}}]);
  let tab = 'map';
  let sheetActions = null;

  const stack = () => stacks[tab];
  const top = () => stack()[stack().length - 1];
  const params = () => top().params;

  /* ---------------- рендер ---------------- */
  /* transition=true лише при переході між екранами (go/push/replace/back) —
     не при кожному дрібному оновленні стану (набір тексту, галочка), щоб не
     смикати весь блок і не заважати друкувати. */
  function render(transition){
    const cur = top();
    const view = Views.map[cur.view];
    if(!view) return;

    const a = document.activeElement;
    const key = a && a.dataset && a.dataset.model ? a.dataset.model : (a && a.id ? a.id : null);
    const caret = a && typeof a.selectionStart === 'number' ? a.selectionStart : null;

    const main = document.getElementById('main');
    main.innerHTML = view.render(cur.params);
    if(transition){
      main.classList.remove('page-enter');
      void main.offsetWidth;           // форсуємо reflow, щоб анімація перезапустилась
      main.classList.add('page-enter');
    }
    renderTop(view);
    renderNav();
    if(view.mount) view.mount(cur.params);

    if(key){
      const el = document.querySelector(`[data-model="${key}"]`) || document.getElementById(key);
      if(el && el.focus){
        el.focus();
        if(caret !== null && el.setSelectionRange){ try{ el.setSelectionRange(caret, caret); }catch(e){} }
      }
    }
  }

  function renderTop(view){
    const canBack = stack().length > 1;
    const title = typeof view.title === 'function' ? view.title(params()) : view.title;
    document.getElementById('topbar').innerHTML = `
      <button class="tb-btn ${canBack ? '' : 'ghost'}" data-act="__back">‹</button>
      <div class="tb-title">${Utils.esc(title || currentTabLabel())}</div>
      <div class="gems"><span class="g">◆</span>${Store.db.gems}</div>`;
  }

  function currentTabLabel(){
    const t = TABS.find(x => x.id === tab);
    return t ? t.label : '';
  }

  function counts(){
    return {
      learn: Store.toLearn().length,
      review: Store.due().length,
      tests: 0, map: 0, lists: 0, more: 0, reading: 0
    };
  }

  function renderNav(){
    const n = counts();

    document.getElementById('sidenav').innerHTML = TABS.map(t => `
      <button class="${t.id === tab ? 'on' : ''}" data-act="__tab" data-v="${t.id}">
        <i>${t.icon}</i>${t.label}
        ${n[t.id] ? `<span class="n">${n[t.id] > 99 ? '99+' : n[t.id]}</span>` : ''}
      </button>`).join('');

    const st = Store.stats();
    document.getElementById('sidefoot').innerHTML = `
      <div class="side-stat">◆ <b>${st.gems}</b> самоцвітів</div>
      <div class="side-stat">📈 <b>${st.coverage}%</b> карти пройдено</div>
      <div class="side-stat">🎓 <b>${st.mastered}</b> вивчено</div>`;

    document.getElementById('tabbar').innerHTML = TABS.map(t => `
      <button class="${t.id === tab ? 'on' : ''}" data-act="__tab" data-v="${t.id}">
        <i>${t.icon}</i>${t.label.split(' ')[0]}
        ${n[t.id] ? `<span class="n">${n[t.id] > 99 ? '99+' : n[t.id]}</span>` : ''}
      </button>`).join('');
  }

  /* ---------------- навігація ---------------- */
  function go(tabId){
    if(!stacks[tabId]) return;
    /* повторний тап на вже активному розділі скидає його стек до кореня —
       звичний патерн мобільних застосунків замість «нічого не робить» */
    if(tabId === tab && stacks[tabId].length === 1) return;
    if(tabId === tab) stacks[tabId].length = 1;
    tab = tabId;
    window.scrollTo(0,0);
    render(true);
  }

  function push(view, p = {}){
    stack().push({view, params: p});
    resetViewState(view);
    window.scrollTo(0,0);
    render(true);
  }

  function replace(view, p = {}){
    stack()[stack().length - 1] = {view, params: p};
    window.scrollTo(0,0);
    render(true);
  }

  function back(){
    if(stack().length > 1){ stack().pop(); window.scrollTo(0,0); render(true); }
  }

  /* екрани з власним станом скидаємо при новому вході */
  function resetViewState(view){
    const v = Views.map[view];
    if(!v) return;
    if(view === 'compare') v.state = {with:null, text:null, loading:false, error:''};
    if(view === 'session') v.state = {shown:false, done:0, good:0};
    if(view === 'list'){ v.state = {filter:'all'}; v.form = {q:''}; }
  }

  /* ---------------- модальний лист ---------------- */
  function sheet(html, actions){
    sheetActions = actions || null;
    const el = document.getElementById('sheet');
    el.innerHTML = `<div class="sheet">${html}</div>`;
    el.classList.remove('hidden');
    el.onclick = ev => { if(ev.target === el) closeSheet(); };
  }

  function closeSheet(){
    sheetActions = null;
    const el = document.getElementById('sheet');
    el.classList.add('hidden');
    el.innerHTML = '';
  }

  function confirm(message, onYes){
    sheet(`
      <div style="line-height:1.6;margin-bottom:22px;text-align:center">${Utils.esc(message)}</div>
      <button class="btn violet wide" data-act="__yes">Так</button>
      <button class="btn link wide" data-act="__no">Скасувати</button>`,
      { __yes(){ closeSheet(); onYes(); }, __no(){ closeSheet(); } });
  }

  /* ---------------- делеговані події ---------------- */
  const globals = { __back: back, __tab(el, ds){ go(ds.v); } };

  /* Захист від подвійного спрацювання конкретної кнопки: дублікати click-подій
     (наприклад touchend+click на мобільному, або фізичний тремор пальця) не
     мають виконати дію двічі. Прив'язано до самого DOM-елемента, а не до назви
     дії — після кожного render() з'являються нові елементи, тож послідовні
     натискання на різні (навіть однойменні) кнопки одна за одною ніколи не
     блокуються, лише справжній дубль-клік по одній і тій самій кнопці. */
  const fireGuard = new WeakSet();
  function isDuplicateClick(el){
    if(fireGuard.has(el)) return true;
    fireGuard.add(el);
    setTimeout(() => fireGuard.delete(el), 400);
    return false;
  }

  function dispatch(el, ev){
    const name = el.dataset.act;
    if(!name) return;

    const isControl = el.matches('input[type=checkbox], select, input[type=file], input.note-input');
    if(isControl !== (ev.type === 'change')) return;

    const view = Views.map[top().view];
    const fn = (sheetActions && sheetActions[name])
            || (view && view.actions && view.actions[name])
            || globals[name];
    if(!fn) return;

    if(ev.type === 'click'){
      ev.preventDefault();
      if(isDuplicateClick(el)) return;
    }
    fn.call(view, el, el.dataset);
  }

  document.addEventListener('click', ev => {
    const el = ev.target.closest('[data-act]');
    if(el) dispatch(el, ev);
  });
  document.addEventListener('change', ev => {
    const el = ev.target.closest('[data-act]');
    if(el) dispatch(el, ev);
  });

  document.addEventListener('input', ev => {
    const el = ev.target.closest('[data-model]');
    if(!el) return;
    const view = Views.map[top().view];
    if(!view || !view.form) return;
    view.form[el.dataset.model] = el.value;
    if(el.dataset.live === '1') render();
  });
  document.addEventListener('change', ev => {
    const el = ev.target.closest('select[data-model]');
    if(!el) return;
    const view = Views.map[top().view];
    if(view && view.form){ view.form[el.dataset.model] = el.value; render(); }
  });

  window.addEventListener('popstate', () => {
    if(stack().length > 1){ back(); history.pushState(null, ''); }
  });

  function boot(){
    history.pushState(null, '');
    /* відкриваємось там, де сьогодні є робота */
    tab = Store.due().length ? 'review' : Store.toLearn().length ? 'learn' : 'map';
    render();

    /* Підключення до спільного сховища: власний збережений конфіг має
       перевагу, інакше — вбудований за замовчуванням. Якщо користувач сам
       натиснув «Відключити», cloudDisabled=true і автопідключення не лізе. */
    const s = Store.db.settings;
    const cfg = s.firebaseConfig || (typeof DEFAULT_FIREBASE_CONFIG !== 'undefined' ? DEFAULT_FIREBASE_CONFIG : '');
    if(cfg && !s.cloudDisabled && typeof Cloud !== 'undefined' && typeof startCloudWatch === 'function'){
      Cloud.configure(cfg).then(() => {
        if(!s.firebaseConfig){ s.firebaseConfig = cfg; Store.save(); }
        startCloudWatch();
      }).catch(() => {});
    }
  }

  return { render, go, push, replace, back, boot, sheet, closeSheet, confirm, top, params };
})();

App.boot();

</script>
</body>
</html>
